name: YouTube Channel Tracker

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: "tracker-bot"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Tracker Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python main.py

      - name: Commit and Save State
        run: |
          git config --global user.name "actions-bot"
          git config --global user.email "bot@github.com"

          if [ ! -f state.json ]; then
            echo "::error::state.json does not exist!"
            exit 1
          fi

          # --- Keepalive Logic ---
          last_commit_ts=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          now_ts=$(date +%s)
          age_days=$(( (now_ts - last_commit_ts) / 86400 ))
          if [ "$age_days" -gt 45 ]; then
            echo "Repo idle for ${age_days} days. Writing keepalive."
            echo "keepalive $(date -u +%Y-%m-%dT%H:%M:%SZ)" > keepalive.txt
          fi

          # --- Stage Files ---
          git add state.json config.json
          if [ -f keepalive.txt ]; then
            git add keepalive.txt
          fi

          # --- Check for Changes ---
          if git diff --staged --quiet; then
            echo "No state changes."
            exit 0
          fi
          
          git commit -m "Update state and config [skip ci]"

          # --- Retry Loop with Conflict Resolution ---
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin main; then
              echo "State saved."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed. Retrying in 5 seconds (Attempt $i/3)..."
            sleep 5
          done
          
          echo "::error::Failed to push state after 3 tries."
          exit 1
