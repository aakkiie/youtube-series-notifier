name: YouTube Channel Tracker

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: "tracker-bot"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Tracker Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit and Save State
        run: |
          git config --global user.name "actions-bot"
          git config --global user.email "bot@github.com"
          
          if [ ! -f state.json ]; then
            echo "::error::state.json does not exist! Failing loud to prevent repeat alerts."
            exit 1
          fi

          git add state.json config.json

          if git diff --staged --quiet; then
            echo "No state changes detected. Repository is already up to date."
          else
            echo "State changes detected. Committing and pushing..."
            git commit -m "Update state and config [skip ci]"
            
            git pull --rebase origin main || true
            
            if ! git push origin main; then
              echo "::error::CRITICAL: Failed to push to repository! Check branch permissions."
              exit 1
            fi
            echo "State saved and pushed successfully."
          fi
