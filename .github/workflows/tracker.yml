name: YouTube Channel Tracker

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: "tracker-bot"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-feed:
    runs-on: ubuntu-latest
    # Hard ceiling so a stuck run can never block the schedule forever.
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Shallow clone: `git log -1` still returns the tip commit timestamp,
          # which is enough for the keepalive check below.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Tracker Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: set this as a repository Variable (Settings → Secrets and variables → Actions → Variables tab).
          # If unset, main.py falls back to "gemini-3.7-flash".
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python main.py

      - name: Commit and Save State
        run: |
          git config --global user.name "actions-bot"
          git config --global user.email "bot@github.com"

          if [ ! -f state.json ]; then
            echo "::error::state.json does not exist! Failing loud to prevent repeat alerts."
            exit 1
          fi

          # Keepalive: GitHub disables scheduled workflows after 60 days of repo inactivity.
          # On a shallow clone, `git log -1 --format=%ct` returns the tip commit's unix time.
          # Only write keepalive.txt if the last commit is older than 45 days.
          last_commit_ts=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          now_ts=$(date +%s)
          age_days=$(( (now_ts - last_commit_ts) / 86400 ))
          if [ "$age_days" -gt 45 ]; then
            echo "Repo idle for ${age_days} days. Writing keepalive."
            echo "keepalive $(date -u +%Y-%m-%dT%H:%M:%SZ)" > keepalive.txt
          fi

          git add state.json config.json
          if [ -f keepalive.txt ]; then
            git add keepalive.txt
          fi

          if git diff --staged --quiet; then
            echo "No state changes detected. Repository is already up to date."
          else
            echo "State changes detected. Committing and pushing..."
            git commit -m "Update state and config [skip ci]"

            git pull --rebase origin main || true

            if ! git push origin main; then
              echo "::error::CRITICAL: Failed to push to repository! Check branch permissions."
              exit 1
            fi
            echo "State saved and pushed successfully."
          fi
